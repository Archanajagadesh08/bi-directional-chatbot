<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Register- SyncAI</title>
        <link rel="stylesheet" href="/static/auth.css">
    </head>
    <body>
        <div class="auth-container">
            <div class="auth-card">
                <!-- temporary brand mark -->
                <div class="auth-brand">
                    ✨
                </div>
                <h1>Create Your Account</h1>
                <p class="subtitle">join AsynAI and start your journey</p>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Choose a Username" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter Your Email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter Your Password" required>
                         <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
                            👁️
                        </button>
                    </div>
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Confirm Password</label>
                        <div class="password-wrapper">
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Your Password" required>
                        <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Show password">
                            👁️
                        </button>
                    </div>
                    </div>
                    <button type="submit" class="auth-button">Register</button>
                </form>
                <p class="switch-auth">Already have an account? <a href="/login">Login</a></p>
            </div>
        </div>
        <script src="/static/register.js">     
        </script>
    </body>
</html>
